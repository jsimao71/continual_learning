[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-learning-mechanisms"
version = "0.1.0"
description = "Causal experiments on recurrent Transformer computation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "matplotlib>=3.7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

